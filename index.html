<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代風格倒數計時器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Tone.js 用於生成提示音效，無需外部音檔 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- 引入 Google Fonts (Inter & JetBrains Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
        /* 隱藏數字輸入框的預設上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* 進度條平滑過渡 */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* 閃爍動畫（時間到時使用） */
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.8; }
        }
        .animate-alarm {
            animation: pulse-ring 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <!-- 主容器 -->
    <main class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
        
        <!-- 頂部裝飾光暈 -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- 標題與狀態列 -->
        <header class="w-full flex items-center justify-between mb-6 z-10">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <h1 class="text-lg font-semibold tracking-wide text-slate-100">專注倒數計時器</h1>
            </div>
            <!-- 音效開關按鈕 -->
            <button id="soundToggleBtn" title="切換提示音效" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700/50">
                <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            </button>
        </header>

        <!-- 圓形進度條與時間顯示區 -->
        <div id="timerVisualContainer" class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2 z-10">
            <!-- SVG 圓環 -->
            <svg class="w-full h-full" viewBox="0 0 260 260">
                <!-- 背景底環 -->
                <circle class="text-slate-800" stroke-width="10" stroke="currentColor" fill="transparent" r="115" cx="130" cy="130" />
                <!-- 動態進度環 -->
                <circle id="progressRing" class="progress-ring__circle text-indigo-500" stroke-width="10" stroke-linecap="round" stroke="currentColor" fill="transparent" r="115" cx="130" cy="130" />
            </svg>

            <!-- 中央時間文字與標籤 -->
            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span id="statusBadge" class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 mb-2 border border-slate-700/50">
                    準備就緒
                </span>
                <div id="timeDisplay" class="font-mono-num text-4xl sm:text-5xl font-bold tracking-tight text-white">
                    05:00
                </div>
                <div id="endTimeHint" class="text-xs text-slate-400 mt-2 h-4">
                    <!-- 預計結束時間提示 -->
                </div>
            </div>
        </div>

        <!-- 自訂時間輸入面板 (僅在未計時時顯示) -->
        <div id="customInputPanel" class="w-full mt-4 mb-2 z-10 transition-all duration-300">
            <div class="grid grid-cols-3 gap-2.5 bg-slate-950/60 p-3 rounded-2xl border border-slate-800/80">
                <!-- 小時 -->
                <div class="flex flex-col items-center">
                    <label for="inputHours" class="text-[11px] uppercase tracking-wider text-slate-400 mb-1">小時</label>
                    <input type="number" id="inputHours" min="0" max="99" value="0" class="w-full text-center font-mono-num text-xl font-semibold bg-slate-900 border border-slate-700 rounded-xl py-1.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <!-- 分鐘 -->
                <div class="flex flex-col items-center">
                    <label for="inputMinutes" class="text-[11px] uppercase tracking-wider text-slate-400 mb-1">分鐘</label>
                    <input type="number" id="inputMinutes" min="0" max="59" value="5" class="w-full text-center font-mono-num text-xl font-semibold bg-slate-900 border border-slate-700 rounded-xl py-1.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <!-- 秒數 -->
                <div class="flex flex-col items-center">
                    <label for="inputSeconds" class="text-[11px] uppercase tracking-wider text-slate-400 mb-1">秒數</label>
                    <input type="number" id="inputSeconds" min="0" max="59" value="0" class="w-full text-center font-mono-num text-xl font-semibold bg-slate-900 border border-slate-700 rounded-xl py-1.5 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
            </div>

            <!-- 快速預設按鈕 -->
            <div class="flex flex-wrap items-center justify-center gap-2 mt-3">
                <button type="button" data-preset="60" class="preset-btn px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition-all active:scale-95">1 分鐘</button>
                <button type="button" data-preset="300" class="preset-btn px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition-all active:scale-95">5 分鐘</button>
                <button type="button" data-preset="900" class="preset-btn px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition-all active:scale-95">15 分鐘</button>
                <button type="button" data-preset="1500" class="preset-btn px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition-all active:scale-95">25 分鐘</button>
            </div>
        </div>

        <!-- 主要控制按鈕區 -->
        <div class="w-full grid grid-cols-2 gap-3 mt-5 z-10">
            <button id="startPauseBtn" class="col-span-1 py-3.5 px-4 rounded-2xl font-semibold text-base bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/25 transition-all active:scale-95 flex items-center justify-center gap-2">
                <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                <span id="startPauseText">開始</span>
            </button>

            <button id="resetBtn" class="col-span-1 py-3.5 px-4 rounded-2xl font-semibold text-base bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all active:scale-95 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>重設</span>
            </button>
        </div>

        <!-- 訊息通知橫幅 (取代原生 alert) -->
        <div id="messageToast" class="mt-4 w-full py-2.5 px-4 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-sm text-center hidden transition-all">
            時間到！倒數計時已完成。
        </div>
    </main>

    <script>
        /**
         * 倒數計時器核心邏輯
         * 包含時間計算、SVG 圓環進度更新、Tone.js 音效合成與 UI 狀態同步
         */
        document.addEventListener('DOMContentLoaded', () => {
            // DOM 元素參考
            const timeDisplay = document.getElementById('timeDisplay');
            const endTimeHint = document.getElementById('endTimeHint');
            const statusBadge = document.getElementById('statusBadge');
            const progressRing = document.getElementById('progressRing');
            const timerVisualContainer = document.getElementById('timerVisualContainer');
            const customInputPanel = document.getElementById('customInputPanel');
            
            const inputHours = document.getElementById('inputHours');
            const inputMinutes = document.getElementById('inputMinutes');
            const inputSeconds = document.getElementById('inputSeconds');
            
            const startPauseBtn = document.getElementById('startPauseBtn');
            const startPauseText = document.getElementById('startPauseText');
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            const resetBtn = document.getElementById('resetBtn');
            const soundToggleBtn = document.getElementById('soundToggleBtn');
            const soundOnIcon = document.getElementById('soundOnIcon');
            const soundOffIcon = document.getElementById('soundOffIcon');
            const messageToast = document.getElementById('messageToast');
            const presetBtns = document.querySelectorAll('.preset-btn');

            // 圓環周長計算 (半徑 r = 115)
            const radius = 115;
            const circumference = 2 * Math.PI * radius;
            progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
            progressRing.style.strokeDashoffset = 0;

            // 計時器狀態變數
            let totalSeconds = 300;       // 總設定秒數 (預設 5 分鐘)
            let remainingSeconds = 300;   // 剩餘秒數
            let timerInterval = null;     // setInterval 參照
            let isRunning = false;        // 是否正在倒數
            let isSoundEnabled = true;    // 是否開啟音效
            let alarmInterval = null;     // 鬧鈴重複播放參照

            /**
             * 播放完成提示音效 (使用 Tone.js 合成柔和的雙音和弦)
             */
            async function playAlarmSound() {
                if (!isSoundEnabled || typeof Tone === 'undefined') return;
                try {
                    await Tone.start();
                    const synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.02, decay: 0.2, sustain: 0.1, release: 0.8 }
                    }).toDestination();

                    const now = Tone.now();
                    synth.triggerAttackRelease("C5", "8n", now);
                    synth.triggerAttackRelease("E5", "8n", now + 0.15);
                    synth.triggerAttackRelease("G5", "4n", now + 0.3);
                } catch (err) {
                    console.warn("音效播放受限:", err);
                }
            }

            /**
             * 格式化秒數為 HH:MM:SS 或 MM:SS
             */
            function formatTime(sec) {
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;

                const mStr = String(m).padStart(2, '0');
                const sStr = String(s).padStart(2, '0');

                if (h > 0) {
                    return `${String(h).padStart(2, '0')}:${mStr}:${sStr}`;
                }
                return `${mStr}:${sStr}`;
            }

            /**
             * 更新圓環進度與畫面文字
             */
            function updateDisplay() {
                timeDisplay.textContent = formatTime(remainingSeconds);
                
                // 更新網頁標題方便分頁查看
                document.title = isRunning 
                    ? `(${formatTime(remainingSeconds)}) 倒數計時器` 
                    : '現代風格倒數計時器';

                // 計算進度百分比
                const progress = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
                const offset = circumference - progress * circumference;
                progressRing.style.strokeDashoffset = offset;

                // 依據剩餘比例改變圓環顏色
                progressRing.classList.remove('text-indigo-500', 'text-amber-500', 'text-rose-500', 'text-emerald-500');
                if (remainingSeconds === 0 && totalSeconds > 0) {
                    progressRing.classList.add('text-emerald-500');
                } else if (progress <= 0.2 && isRunning) {
                    progressRing.classList.add('text-rose-500');
                } else if (progress <= 0.5 && isRunning) {
                    progressRing.classList.add('text-amber-500');
                } else {
                    progressRing.classList.add('text-indigo-500');
                }
            }

            /**
             * 計算並顯示預計結束時間
             */
            function updateEndTimeHint() {
                if (!isRunning || remainingSeconds <= 0) {
                    endTimeHint.textContent = '';
                    return;
                }
                const endDate = new Date(Date.now() + remainingSeconds * 1000);
                const hours = String(endDate.getHours()).padStart(2, '0');
                const minutes = String(endDate.getMinutes()).padStart(2, '0');
                endTimeHint.textContent = `預計 ${hours}:${minutes} 結束`;
            }

            /**
             * 從輸入框讀取並同步時間設定
             */
            function syncFromInputs() {
                let h = Math.max(0, Math.min(99, parseInt(inputHours.value, 10) || 0));
                let m = Math.max(0, Math.min(59, parseInt(inputMinutes.value, 10) || 0));
                let s = Math.max(0, Math.min(59, parseInt(inputSeconds.value, 10) || 0));

                inputHours.value = h;
                inputMinutes.value = m;
                inputSeconds.value = s;

                totalSeconds = h * 3600 + m * 60 + s;
                remainingSeconds = totalSeconds;
                stopAlarm();
                updateDisplay();
            }

            /**
             * 停止鬧鈴與完成提示狀態
             */
            function stopAlarm() {
                if (alarmInterval) {
                    clearInterval(alarmInterval);
                    alarmInterval = null;
                }
                timerVisualContainer.classList.remove('animate-alarm');
                messageToast.classList.add('hidden');
            }

            /**
             * 計時結束處理
             */
            function handleTimerComplete() {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;

                // 更新按鈕與狀態標籤
                startPauseText.textContent = '開始';
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                startPauseBtn.classList.replace('bg-amber-600', 'bg-indigo-600');
                startPauseBtn.classList.replace('hover:bg-amber-500', 'hover:bg-indigo-500');

                statusBadge.textContent = '計時完成';
                statusBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 mb-2 border border-emerald-500/40';
                endTimeHint.textContent = '';
                customInputPanel.classList.remove('opacity-40', 'pointer-events-none');

                // 視覺與聲音提醒
                timerVisualContainer.classList.add('animate-alarm');
                messageToast.textContent = '時間到！倒數計時已完成。';
                messageToast.classList.remove('hidden');

                playAlarmSound();
                alarmInterval = setInterval(playAlarmSound, 2500);
            }

            /**
             * 開始或暫停倒數
             */
            function toggleTimer() {
                stopAlarm();

                if (isRunning) {
                    // 暫停邏輯
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isRunning = false;

                    startPauseText.textContent = '繼續';
                    playIcon.classList.remove('hidden');
                    pauseIcon.classList.add('hidden');
                    startPauseBtn.classList.replace('bg-amber-600', 'bg-indigo-600');
                    startPauseBtn.classList.replace('hover:bg-amber-500', 'hover:bg-indigo-500');

                    statusBadge.textContent = '已暫停';
                    statusBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 mb-2 border border-amber-500/30';
                    endTimeHint.textContent = '';
                    updateDisplay();
                } else {
                    // 若時間為 0，重新讀取輸入框數值
                    if (remainingSeconds <= 0) {
                        syncFromInputs();
                    }
                    if (remainingSeconds <= 0) {
                        messageToast.textContent = '請先設定大於 0 秒的時間！';
                        messageToast.classList.remove('hidden');
                        return;
                    }

                    // 啟動音訊環境 (因應瀏覽器自動播放政策)
                    if (isSoundEnabled && typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
                        Tone.start();
                    }

                    isRunning = true;
                    startPauseText.textContent = '暫停';
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                    startPauseBtn.classList.replace('bg-indigo-600', 'bg-amber-600');
                    startPauseBtn.classList.replace('hover:bg-indigo-500', 'hover:bg-amber-500');

                    statusBadge.textContent = '倒數中';
                    statusBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 mb-2 border border-indigo-500/30';
                    customInputPanel.classList.add('opacity-40', 'pointer-events-none');

                    updateEndTimeHint();
                    updateDisplay();

                    // 使用時間戳記校準，避免背景分頁延遲誤差
                    let expectedEndTime = Date.now() + remainingSeconds * 1000;

                    timerInterval = setInterval(() => {
                        const now = Date.now();
                        remainingSeconds = Math.max(0, Math.ceil((expectedEndTime - now) / 1000));
                        updateDisplay();

                        if (remainingSeconds <= 0) {
                            handleTimerComplete();
                        }
                    }, 200);
                }
            }

            /**
             * 重設計時器
             */
            function resetTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                stopAlarm();

                syncFromInputs();

                startPauseText.textContent = '開始';
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                startPauseBtn.classList.replace('bg-amber-600', 'bg-indigo-600');
                startPauseBtn.classList.replace('hover:bg-amber-500', 'hover:bg-indigo-500');

                statusBadge.textContent = '準備就緒';
                statusBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 mb-2 border border-slate-700/50';
                endTimeHint.textContent = '';
                customInputPanel.classList.remove('opacity-40', 'pointer-events-none');
                updateDisplay();
            }

            // 事件監聽綁定
            startPauseBtn.addEventListener('click', toggleTimer);
            resetBtn.addEventListener('click', resetTimer);

            // 輸入框即時同步
            [inputHours, inputMinutes, inputSeconds].forEach(input => {
                input.addEventListener('change', () => {
                    if (!isRunning) syncFromInputs();
                });
                input.addEventListener('input', () => {
                    if (!isRunning) {
                        const h = parseInt(inputHours.value, 10) || 0;
                        const m = parseInt(inputMinutes.value, 10) || 0;
                        const s = parseInt(inputSeconds.value, 10) || 0;
                        totalSeconds = Math.max(0, h * 3600 + m * 60 + s);
                        remainingSeconds = totalSeconds;
                        updateDisplay();
                    }
                });
            });

            // 快速預設時間按鈕
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (isRunning) return;
                    const presetSec = parseInt(btn.getAttribute('data-preset'), 10);
                    const h = Math.floor(presetSec / 3600);
                    const m = Math.floor((presetSec % 3600) / 60);
                    const s = presetSec % 60;

                    inputHours.value = h;
                    inputMinutes.value = m;
                    inputSeconds.value = s;
                    syncFromInputs();
                });
            });

            // 音效切換按鈕
            soundToggleBtn.addEventListener('click', () => {
                isSoundEnabled = !isSoundEnabled;
                if (isSoundEnabled) {
                    soundOnIcon.classList.remove('hidden');
                    soundOffIcon.classList.add('hidden');
                } else {
                    soundOnIcon.classList.add('hidden');
                    soundOffIcon.classList.remove('hidden');
                    stopAlarm();
                }
            });

            // 初始化畫面
            updateDisplay();
        });
    </script>
</body>
</html>
